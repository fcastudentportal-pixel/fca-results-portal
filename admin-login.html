<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>FCA Admin Login</title>

<link
  rel="stylesheet"
  href="admin-login.css"
>

</head>


<body>


<div class="login-container">


  <div class="login-card">


    <!-- FCA LOGO -->

    <img
      src="fca-logo.png"
      class="fca-logo"
      alt="First Class Academy"
    >


    <!-- HEADER -->

    <div class="eyebrow">
      ADMINISTRATION
    </div>


    <h1>
      First Class Academy
    </h1>


    <p class="subtitle">
      Administrator Login
    </p>


    <!-- LOGIN FORM -->

    <form
      id="adminLoginForm"
      novalidate
    >


      <!-- EMAIL -->

      <label for="adminEmail">
        Email Address
      </label>

      <input
        type="email"
        id="adminEmail"
        placeholder="Email Address"
        autocomplete="username"
        required
      >


      <!-- PASSWORD -->

      <label for="adminPassword">
        Password
      </label>


      <div class="password-wrapper">

        <input
          type="password"
          id="adminPassword"
          placeholder="Enter password"
          autocomplete="current-password"
          required
        >

        <button
          type="button"
          id="passwordToggle"
          class="password-toggle"
          aria-label="Show password"
          title="Show password"
        >
          👁
        </button>

      </div>


      <!-- LOGIN BUTTON -->

      <button
        type="submit"
        class="login-btn"
        id="loginButton"
      >
        Login
      </button>


      <!-- LOGIN MESSAGE -->

      <p
        id="loginMessage"
        class="message"
        aria-live="polite"
      ></p>


    </form>


    <!-- BACK TO PORTAL -->

    <a
      href="index.html"
      class="back-link"
    >
      ← Back to Student Portal
    </a>


  </div>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- FCA CONFIG -->

<script src="config.js"></script>

<!-- FCA ADMIN LOGIN -->

<script src="admin-login.js"></script>


</body>

</html>
