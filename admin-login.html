<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>FCA Admin Login</title>

<link
  rel="stylesheet"
  href="admin-login.css"
>

</head>


<body>


<div class="login-container">


  <div class="login-card">


    <!-- FCA LOGO -->

    <img
      src="fca-logo.png"
      class="fca-logo"
      alt="First Class Academy"
    >


    <!-- HEADER -->

    <div class="eyebrow">
      ADMINISTRATION
    </div>


    <h1>
      First Class Academy
    </h1>


    <p class="subtitle">
      Administrator Login
    </p>


    <!-- LOGIN FORM -->

    <form
      id="adminLoginForm"
      novalidate
    >


      <!-- EMAIL -->

      <label for="adminEmail">
        Email Address
      </label>

      <input
        type="email"
        id="adminEmail"
        placeholder="Email Address"
        autocomplete="username"
        required
      >


      <!-- PASSWORD -->

      <label for="adminPassword">
        Password
      </label>


      <div class="password-wrapper">

        <input
          type="password"
          id="adminPassword"
          placeholder="Enter password"
          autocomplete="current-password"
          required
        >

        <button
  type="button"
  id="passwordToggle"
  class="password-toggle"
  aria-label="Show password"
  title="Show password"
  aria-pressed="false"
>

  <!-- OPEN EYE -->

  <svg
    class="eye-icon eye-open"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >

    <path
      d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"
    />

    <circle
      cx="12"
      cy="12"
      r="3"
    />

  </svg>


  <!-- CLOSED EYE -->

  <svg
    class="eye-icon eye-closed"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >

    <path d="M3 3l18 18"/>

    <path
      d="M10.6 10.6a2 2 0 0 0 2.8 2.8"
    />

    <path
      d="M9.9 4.2A10.9 10.9 0 0 1 12 4c6.5 0 10 8 10 8a17.8 17.8 0 0 1-3.1 4.4"
    />

    <path
      d="M6.6 6.6C3.7 8.5 2 12 2 12s3.5 8 10 8c1.3 0 2.5-.3 3.6-.8"
    />

  </svg>

        </button>

      </div>


      <!-- LOGIN BUTTON -->

      <button
        type="submit"
        class="login-btn"
        id="loginButton"
      >
        Login
      </button>


      <!-- LOGIN MESSAGE -->

      <p
        id="loginMessage"
        class="message"
        aria-live="polite"
      ></p>


    </form>


    <!-- BACK TO PORTAL -->

    <a
      href="index.html"
      class="back-link"
    >
      ← Back to Student Portal
    </a>


  </div>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- FCA CONFIG -->

<script src="config.js"></script>

<!-- FCA ADMIN LOGIN -->

<script src="admin-login.js"></script>


</body>

</html>
