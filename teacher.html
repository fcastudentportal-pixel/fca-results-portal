<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>FCA Teacher</title><link rel="stylesheet" href="fca-admin.css"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"></head><body><div class="shell"><aside class="sidebar"><div class="brand"><div class="brand-mark">FCA</div><div><b>FCA Portal</b><small>Teacher</small></div></div><nav><button class="nav active">My Class</button></nav><button id="logout" class="logout">Log out</button></aside><main class="main"><header><div><small>TEACHER PORTAL</small><h1>My Class</h1></div><div id="teacherBadge" class="pill"></div></header><section class="panel"><h2>Select class</h2><select id="classSelect"></select></section><section class="panel"><h2>Add all students</h2><p>Add one student per row. The system generates the FCA ID and password automatically.</p><form id="studentsForm"><div id="rows"></div><button type="button" id="addRow" class="secondary">+ Add student</button><button class="primary">Generate accounts</button><p id="msg" class="msg"></p></form></section><section class="panel"><div class="toolbar"><h2>Generated credentials</h2><button id="download" class="secondary">Download CSV</button></div><div id="result" class="list">No accounts generated yet.</div></section></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const sb=supabase.createClient(FCA_CONFIG.SUPABASE_URL,FCA_CONFIG.SUPABASE_ANON_KEY),$=id=>document.getElementById(id);let generated=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function guard(){const r=await sb.auth.getSession();if(!r.data.session)return location.href='login.html';const p=await sb.from('users').select('role,name,email').eq('id',r.data.session.user.id).single();if(p.error||!['teacher','admin'].includes(p.data.role)){await sb.auth.signOut();return location.href='login.html'}$('teacherBadge').textContent=p.data.email}
async function loadClasses(){const r=await sb.from('classes').select('*').order('year',{ascending:false}).order('name');if(r.error){$('msg').textContent=r.error.message;return}$('classSelect').innerHTML=r.data.map(x=>`<option value="${x.id}" data-name="${esc(x.name)}">${esc(x.name)} (${x.year})</option>`).join('')||'<option value="">No classes assigned</option>'}
function addRow(){const d=document.createElement('div');d.className='student-row';d.innerHTML='<input class="fname" placeholder="Full name (e.g. Alex Meja)" required><button type="button" class="remove secondary">Remove</button>';d.querySelector('.remove').onclick=()=>d.remove();$('rows').appendChild(d)}addRow();$('addRow').onclick=addRow;
$('studentsForm').onsubmit=async e=>{e.preventDefault();generated=[];$('msg').textContent='Generating accounts…';const names=[...document.querySelectorAll('.fname')].map(x=>x.value.trim()).filter(Boolean),classId=$('classSelect').value,className=$('classSelect').selectedOptions[0]?.dataset.name;if(!classId||!names.length){$('msg').textContent='Select a class and add at least one student.';return}try{const {data:{session}}=await sb.auth.getSession();const r=await fetch(`${FCA_CONFIG.SUPABASE_URL}/functions/v1/create-students`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${session.access_token}`,'apikey':FCA_CONFIG.SUPABASE_ANON_KEY},body:JSON.stringify({classId,className,names})});const j=await r.json();if(!r.ok)throw Error(j.error||'Failed');generated=j.students;$('result').innerHTML=generated.map(x=>`<div class="credential"><b>${esc(x.name)}</b><span>${esc(x.studentId)}</span><code>${esc(x.password)}</code></div>`).join('');$('msg').textContent=`Created ${generated.length} account(s). Save/download these credentials now.`}catch(err){$('msg').textContent=err.message}};
$('download').onclick=()=>{if(!generated.length)return;const csv='Name,Student ID,Password\n'+generated.map(x=>[x.name,x.studentId,x.password].map(v=>`"${String(v).replaceAll('"','""')}"`).join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='FCA-student-credentials.csv';a.click()};$('logout').onclick=async()=>{await sb.auth.signOut();location.href='login.html'};guard().then(loadClasses);
</script></body></html>
